nm波长下衍射神经网络的结构设计、分类性能评估和传播距离优化开展研究。&#34;,&#34;body&#34;:&#34;## 1 工作概述\n\n本次主要围绕 1550 nm 波长下衍射深度神经网络的结构设计、分类性能评估和传播距离优化开展研究。在前期复现论文的基础上，进一步考虑实验室使用 1550 nm 激光的实际条件，对网络的物理参数进行了调整，并通过数值仿真研究了不同衍射层数和不同层间传播距离对分类性能的影响。\n\n本次工作主要包括以下五个方面：\n\n1. 进一步确定适用于 1550 nm 波长的 D²NN 仿真参数。\n2. 完成单层、双层、三层和五层网络的 15 轮 训练结果整理与比较。\n3. 对已有模型进行独立测试，重点分析分类准确率和探测效率。\n4. 开展五层 D²NN 非均匀层间距搜索，比较等间距与非等间距结构。\n5. 完善训练代码，并设计后续全数据集对照实验。\n\n## 2 1550 nm D²NN 五层仿真模型参数确定\n\n在先前的仿真过程中，我全程采用论文提供的参数进行实验。与原论文采用的太赫兹波长相比，1550 nm 的波长明显更短，在相同尺寸和传播距离下，衍射行为也会发生明显变化。因此，本阶段重点考虑了波长、神经元间距、传播距离和探测器尺寸之间的关系。\n\n通过参考资料与分组测试，最终采用如下结构作为系统的基准结构。后续仿真过程中，还增加了不等间距组的训练。\n\n| 类别 | 已验证配置 |\n| :--- | ---: |\n| 每层神经元数量 | 200 × 200 |\n| 神经元总量 | 200,000 |\n| 神经元间距 | 50 μm |\n| 相位板尺寸 | 10 × 10 mm² |\n| 输入平面 → 第一层 | 30 mm |\n| 层级间隔 | 100 mm |\n| 第五层 → 探测器 | 100 mm |\n| 传播距离 | 530 mm |\n| 探测器数目 | 10 |\n| 探测器尺寸 | 0.6 × 0.6 mm² |\n\n*表 1　五层等间距网络的基准参数*\n\n![五层等间距网络结构示意图](./images/five-layer-layout.webp)\n\n*图 1　当前五层等间距配置示意图*\n\n## 3 不同层数的分类性能比较\n\n| 层数 | 最佳轮次 | 验证准确率 | 测试准确率 | 正确探测器效率 | 总捕获率 |\n| :--- | ---: | ---: | ---: | ---: | ---: |\n| 1 | 15 | 39.60% | 39.95% | 2.203% | 12.317% |\n| 2 | 14 | 76.70% | 78.18% | 1.303% | 4.035% |\n| 3 | 15 | 83.10% | 83.51% | 0.818% | 2.047% |\n| 5 | 11 | 87.00% | 88.26% | 0.375% | 0.728% |\n\n*表 2　15 轮小范围训练后不同层数系统的测试结果*\n\n为对比不同层数系统的分类性能，我分别对四种层数配置进行了 5 轮与 15 轮小范围训练。使用 3,000 张图片训练后，再使用 10,000 张测试图像进行测试。表 2 汇总了 15 轮小范围训练的结果。\n\n对比实验保持层间距、输入距离和输出距离等参数一致，仅逐步增加相位板层数。单层网络取得 39.95% 的测试准确率，说明在当前光学结构与训练条件下，单次相位调制对 MNIST 分类任务的处理能力较为有限。双层网络的测试准确率达到 78.18%，显著增强了网络对输出光强分布的调控能力。\n\n在这几组实验中，随着网络层数增加，分类准确率的提升幅度逐渐减小，额外层带来的提升并不是线性叠加的。\n\n### 3.1 双层网络的取舍\n\n与单层网络相比，双层网络增加了一块相位板和一段自由空间传播，使光场能够经历更多次相位调制与衍射演化，获得了明显更高的分类准确率，达到 78.18%。鉴于本次为小范围训练，完整数据集训练的结果可能还有一定提升。\n\n同时，正确探测器效率从 2.203% 降为 1.303%，总捕获率从 12.317% 降为 4.035%。单层虽然收光更多，分到真实类别的相对份额却更低，许多类别难以区分。\n\n![双层网络相位分布](./images/two-layer-phases.webp)\n\n![双层网络测试混淆矩阵](./images/two-layer-confusion.webp)\n\n*图 2　双层网络15轮小范围训练结果*\n\n| 层数 | 系统长度 | 准确度 | 正确探测器效率 | 捕获效率 | 正确光强占比 |\n| :--- | ---: | ---: | ---: | ---: | ---: |\n| 1 | 130 mm | 0.3995 | 0.0220 | 0.12 | 0.17 |\n| 2 | 230 mm | 0.7818 | 0.0130 | 0.04 | 0.32 |\n| 3 | 330 mm | 0.8351 | 0.0082 | 0.02 | 0.39 |\n| 5 | 530 mm | 0.8826 | 0.0037 | 0.0072 | 0.49 |\n\n*表 3　不同层数系统探测效率*\n\n与三层和五层网络相比，双层网络的优势在于结构更加简单。所需的光学元件数量更少，对光路搭建和对准的要求也相对较低，从而使得双层网络的捕获效率较高，达到了三层网络的约 2 倍。若实际实验对光学元件数量、系统尺寸和探测器收光能力存在较高要求，双层网络经优化后可能具有更好的实现条件。不过，其相位参数数量只有 80,000 个，明显少于五层网络的 200,000 个，其分类准确率仍低于三层和五层网络。因此，双层 D²NN 在当前实验中体现出分类性能与系统复杂度之间的折中。\n\n另外，由于不同层数的网络总传播长度不同，当前实验还不能完全排除光路长度变化对分类结果的影响。后续仍需要进一步研究固定总传播长度时，不同网络层数的性能变化。\n\n### 3.2 捕获效率限制来源\n\n理想仿真中的相位板不吸收光能，因此需要从其他因素分析光能损失的来源。\n\n#### 3.2.1 有限孔径造成的光能损失\n\n当前相位板尺寸为 $D=10\\,\\mathrm{mm}$，有效光学孔径为 $10\\times10\\,\\mathrm{mm}^2$。光通过相位板后发生衍射，传播过程中光场可能向横向扩展。对于具有相位像素尺度空间变化的光场，可以用以下关系估计其特征衍射角：\n$$\n\\theta \\sim \\frac{\\lambda}{p}.\n$$\n\n代入数值 $\\lambda=1.55\\,\\mu\\mathrm{m}$、$p=50\\,\\mu\\mathrm{m}$，可得：\n$$\n\\theta \\sim 0.031\\,\\mathrm{rad}.\n$$\n\n对应约 1.78° 的偏转。虽然这一估计并不适用于所有光线，但从定性上看，对于只有 10 mm 宽的相位板，传播 100 mm 后，具有较大横向空间频率的光场成分可能到达孔径之外，层数增加会带来更多次潜在的孔径截断，由表 3 可见，这一变化趋势与累积孔径截断的解释一致。\n\n#### 3.2.2 探测器面积限制\n\n每个探测器的面积为：\n\n$$\nA_d=0.6\\times0.6=0.36\\,\\mathrm{mm}^2.\n$$\n\n10 个探测器的总面积为 $3.6\\,\\mathrm{mm}^2$。\n\n相对于相位板面积 $A_{\\mathrm{aperture}}=100\\,\\mathrm{mm}^2$，探测器面积占比为：\n\n$$\n\\frac{3.6}{100}\\times100\\%=3.6\\%.\n$$\n\n也就是说，探测器只能收集有限区域内的光。\n\n## 4 五层网络全集结果\n\n为进一步评估模型的泛化能力，对此前训练得到的五层等间距网络，使用 MNIST 官方 10,000 张测试图像进行了独立评估，结果如下：\n\n![五层等间距网络相位分布](./images/uniform-five-layer-phases.webp)\n\n*图 3　五层网络10轮全集训练相位图*\n\n![五层等间距网络训练曲线](./images/uniform-training.webp)\n\n![非均匀间距网络小范围训练曲线](./images/nonuniform-small-sample-training.webp)\n\n*图 4　D²NN 的 10轮训练过程*\n\n![五层等间距网络混淆矩阵](./images/uniform-confusion.webp)\n\n![五层等间距网络验证曲线](./images/uniform-validation.webp)\n\n*图 5　D²NN 的 10轮训练过程及混淆矩阵*\n\n最终测试准确率达到 **89.23%**，相较小范围训练提高 **0.97 个百分点**。\n\n## 5 五层不等间距参数探寻\n\n![九组非均匀层间距候选搜索结果](./images/spacing-search.webp)\n\n*图 6　不同的不等间距参数小范围训练结果*\n\n衍射网络可以通过调整层间距改善性能。这里列出 9 组参数，在层间总长度固定的条件下，由程序自动生成不同组合，分别训练并比较结果，以枚举法寻找较优的间距方案。\n\n这种方案存在明显局限：计算成本较高，而且只能找到已搜索候选中的较优值，不能保证获得连续参数空间中的最优解。\n\n![小范围训练方案的准确率及探测效率对比](./images/small-sample-comparison.webp)\n\n*图 7　三种准确率较高的方案的相关准确度、正确探测器效率与总光强效率*\n\n通过分类训练，我得到三组准确率较高的方案，并选取其中最高的一组继续训练。四段间距分别为 150 mm、125 mm、75 mm、25 mm，训练 15 轮，其他参数与五层等间距网络保持一致。相关结果如下：\n\n![非均匀间距网络混淆矩阵](./images/nonuniform-confusion.webp)\n\n![非均匀间距网络小范围训练曲线](./images/nonuniform-small-sample-training.webp)\n\n![非均匀间距网络全集训练曲线](./images/nonuniform-training.webp)\n\n![非均匀间距网络全集验证曲线](./images/nonuniform-validation.webp)\n\n![非均匀间距网络五层相位分布](./images/nonuniform-five-layer-phases.webp)\n\n*图 8　非均匀间隔网络10轮全集训练结果*\n\n网络测试准确率为 **89.14%**，与等间距网络的性能对比如下：\n\n| 指标 | 等间距 | 非均匀间距 | 对比结果 |\n| :--- | ---: | ---: | ---: |\n| 最佳 Epoch | 7 | 7 | - |\n| 最佳验证准确率 | 87.98% | 88.14% | +0.16% |\n| 测试准确率 | 89.23% | 89.14% | -0.09% |\n| 正确探测器效率 | 0.1726% | 0.1801% | +4.34% |\n| 全部探测器捕获效率 | 0.2809% | 0.3044% | +8.37% |\n| 正确探测器光强占比 | 58.41% | 56.52% | -1.90% |\n| FFT 窗口能量比例 | 38.40% | 43.62% | +5.22% |\n\n*表 4　均匀网络与非均匀网络的对比表*\n\n从对比中可以看到，使用非等间距后能有效提升网络的正确探测器效率与捕获效率，这意味着在当前仿真条件下，非均匀结构能让更多光能进入探测器区域。在相同输入光功率下，更高的探测器捕获效率有助于提高可获得的探测信号。不过当前正确探测器效率仅为约 0.18%，绝对数值依然很低。实际信噪比是否改善，还需要考虑探测器噪声、串扰及光学损耗。\n\n![等间距与非均匀间距网络训练过程对比](./images/uniform-nonuniform-training-comparison.webp)\n\n*图 9　均匀网络与非均匀网络训练过程*\n\n从训练过程来看，非均匀间距网络整体表现出一定优势。两种网络均在训练初期快速收敛，但非均匀间距网络在前期具有更高的分类准确率，且在大多数训练轮次中保持了略高的验证准确率，说明其能够较快建立有效的分类能力。第 7 轮时，非均匀间距网络的最佳验证准确率达到 88.14%，高于等间距网络的 87.98%。\n\n更值得关注的是，非均匀间距网络在整个训练过程中始终保持了更高的探测器光能捕获效率，最终测试中正确探测器效率相对提高 4.34%，全部探测器捕获效率相对提高 8.37%，FFT 窗口能量比例相对提高 13.59%。\n\n虽然非均匀网络的损失函数略高，最终测试准确率也略低 0.09 个百分点，但两种网络的分类性能总体接近。这表明非均匀层间距能够在基本保持分类性能的同时，提高光能捕获效率，为后续 D²NN 网络结构优化提供了有价值的方向。\n\n### 5.1 将层间距作为可训练参数的思路\n\n在枚举法之外，我还考虑了第二种方法。本次仿真使用角谱法，其传播传递函数为：\n$$\nH\\left({f}_{x},{f}_{y},z\\right)=\\operatorname{exp}\\left[iz\\left(\\sqrt{{k}^{2}-{\\left(2\\pi {f}_{x}\\right)}^{2}-{\\left(2\\pi {f}_{y}\\right)}^{2}}-k\\right)\\right]\n$$\n\n也就是说，传播距离 $z$ 直接参与光场计算，因此可以通过自动微分计算损失函数对传播距离的梯度，即把层间距变成可训练参数。这样一次训练过程中就可以不断调整传播距离，无须提前枚举大量候选组合，能够大大提高训练的效率。\n\n## 6 源码解读\n\n### 6.1 网络结构与参数设置模块\n\n程序以论文为理论基础，构建了五层相位型衍射分类网络，每层包含 200 × 200 个神经元，共有 20 万个可训练相位参数。程序支持设置工作波长、神经元间距、层间距及探测器尺寸等物理参数。其中，四段层间距可以独立指定，用于研究等间距与非均匀间距结构对网络性能的影响。\n\n### 6.2 输入图像编码模块\n\n程序采用 MNIST 手写数字数据集进行分类训练，通过 `encode()` 函数将 28 × 28 灰度图像转换为输入光场。具体过程包括图像二值化、像素尺度调整、居中补零及强度归一化，使数字图像能够以光场振幅分布的形式输入衍射网络。该部分属于本次仿真的具体输入编码实现。\n\n### 6.3 光场传播与相位调制模块\n\n光场传播是程序的核心部分。参考衍射神经网络的光学传播原理，程序利用快速傅里叶变换（FFT）实现角谱法（ASM），模拟光场在自由空间中的传播。角谱法的数值传播理论及采样问题可参考 Matsushima 等人的研究。每层衍射单元通过复数透射函数实现相位调制，程序将可训练参数映射至 $0$～$\\pi$ 的相位范围。对于非均匀间距网络，分别构建不同传播距离对应的传递函数，从而模拟各层之间不同的光场传播过程。\n\n### 6.4 光强探测与分类模块\n\n参考 D²NN 的光强探测分类机制，程序在输出平面设置 10 个探测区域，分别对应数字 0～9。光场经过五层传播与调制后，通过计算复振幅的模平方获得输出光强，再对各探测区域内的光强进行积分。最终以接收光强最大的探测器作为预测类别，实现手写数字的光学分类。\n\n### 6.5 损失函数模块\n\n程序通过 `compute_loss()` 函数计算网络的优化目标，提供 Baseline 和 Joint 两种损失函数。Baseline 综合考虑分类交叉熵、正确探测器效率及探测器外能量比例；Joint 则采用对数效率惩罚，加强对正确探测器效率和总探测器捕获效率的优化。两种损失函数均为本次仿真的具体设计。\n\n### 6.6 网络训练与参数优化模块\n\n程序基于 PyTorch 深度学习框架实现网络训练，并使用 Adam 优化算法更新相位参数。训练过程中，程序通过自动微分计算损失函数对各层相位参数的梯度，实现相位分布的迭代优化。同时使用验证集评估网络性能，并根据验证准确率及验证损失选择最佳模型。层间传播距离在训练前确定，不参与梯度更新。\n\n### 6.7 性能评估与结果输出模块\n\n训练完成后，程序对最佳模型进行性能评估，主要统计分类准确率、正确探测器效率、全部探测器捕获效率及光强占比等指标，并保存训练曲线、混淆矩阵和各层相位分布图。这些结果用于分析不同层间距结构对分类性能与光能利用率的影响，为后续网络结构优化提供依据。\n\n<!-- 编辑待核对项（不在博客正文中显示）：\n- 原文非均匀层间距写为 150/125/75/25 mm，图内标注为 150/125/75/50 mm。本稿保留正文数值，待作者核对实际配置。\n- 原文在“10 轮全集训练”部分插入了标注“15 epochs / 3000 training samples”的图片，且该图重复出现。本稿保留图片及位置，待作者确认。\n- 表 4 对比结果列沿用原数值。准确率及光强比例的差值与效率的相对变化使用不同口径，发布前请统一“百分点”和“相对百分比”的标注；58.41% 与 56.52% 的显示值之差也需核对舍入。\n-->\n\n[code](https://github.com/royzrh/simulation-d2nn)&#34;},{&#34;title&#34;:&#34;Dream’s notebook&#34;,&#34;url&#34;:&#34;/en/blog/post-2026-11-21-15-05-45&#34;,&#34;description&#34;:&#34;我昨晚梦到…&#34;,&#34;body&#34;:&#34;## 睡觉💤  \n### 2026\n#### 11月27日\n2003，阿尔伯克奇……  \nbetter call roy！🤣🤣🤣🤣🤣🤣\n又忘了具体在干嘛了，打赢了一场官司，然后走在法院的走廊里。昨天晚上，今天早上睡的很早🫪。\n#### 11月21日\n梦见我穿越进了怪奇物语的世界…\n#### 11月20日\n我们在海边的石板路上散步…\n#### 10月16日\n一个巨巨神奇的梦，我梦见我用我的世界做了一个加法器和一个随机骰子的红石电路，然后有一个老师叫我去找他，要boss直聘，然后我就去了，位置在院楼4楼，然后我到了以后，发现出电梯那个层高巨高，有一边有一堆研究生，然后叫我过去，有一个大门，门口一对研究的，一个人脸识别，里面还有一个小门，一堆研究生一个人脸识别，然后进去之后，要先左转再左转，先经过一个大厅然后再进入一个巨大的办公室，办公室有点像我的世界那个矿洞的感觉，很高，然后装修是比较深的颜色，暖黄的光，他的主要的办公区域那一块像客厅，然后喊我坐下，在一个沙发上，然后先跟我聊天，我给他展示了我的东西，然后他说不错不错，然后又聊了好久，他是那种特别耿直的那种，然后我进门的时候研究生跟我说他是有一种帮派风格，然后我突然梦见我和龙虾片在一个雪山上骑车下来，发生了雪崩，我们弃车逃跑，然后晕过去了，第二天发现我们在一个小屋里，车也被救出来了，然后又回到开始说的那个梦，我说我很抱歉，我有一个offer了，然后又聊聊聊，终于结束了，然后我出门了下楼了，跟我发小去爬青城山了，那个动车变成过山车了，特刺激，然后狂吃狂吃的，就醒了。\n#### 10月4日\n我、熊还有我的其他朋友在一个旅游大巴上，我们进入了风骚律师的那个剧里面，我们车上有老麦克和吉米，然后好像是要去郊游，我们在摆龙门阵。这个时候突然被袭击了…\n#### 6月19日\n我梦见我在天上飞。\n#### 5月29日\n和一群好朋友合租了一个big house，有很多个房间，圣诞节快到了，我们在比赛谁的房间最好看，于是哼哧哼哧的布置房间～\n#### 4月23日\n梦见和高中朋友一起去纽约了。\n### 2025\n#### 8月12日\n噩梦！我梦见伽椰子了，大的离谱的伽椰子，所有人去水库避灾。\n### 2024\n#### 9月12日\n我昨天晚上，梦见我在一个欧洲小镇，好像是意大利吧，我在骑车，然后梦见我在一座山下面露营，煮了一锅火锅，煮了泡面，还烤了肉，喝着滚滚的茶，看着电影，然后雨从天幕飞到锅里，蓝色的天，暖黄的灯，炽热的火，我倒在我的帐篷里，醒了。\n## 晚安&#34;},{&#34;title&#34;:&#34;甘南&#34;,&#34;url&#34;:&#34;/en/blog/travel-gannan&#34;,&#34;description&#34;:&#34;2022.08.03 - 08.07&#34;,&#34;body&#34;:&#34;即将更新～&#34;},{&#34;title&#34;:&#34;甘孜州&#34;,&#34;url&#34;:&#34;/en/blog/travel-garze&#34;,&#34;description&#34;:&#34;2025.08.02 - 08.10&#34;,&#34;body&#34;:&#34;即将更新～&#34;},{&#34;title&#34;:&#34;兰卡威&#34;,&#34;url&#34;:&#34;/en/blog/travel-lankawi&#34;,&#34;description&#34;:&#34;2018,06.24 - 06.29&#34;,&#34;body&#34;:&#34;还没有写～&#34;},{&#34;title&#34;:&#34;北疆&#34;,&#34;url&#34;:&#34;/en/blog/travel-xinjiang&#34;,&#34;description&#34;:&#34;2026.01.30 - 02.05&#34;,&#34;body&#34;:&#34;年初，偶然一次看到深圳至乌鲁木齐的航班原来只要一千块，相比回到四川的机票更加划算。花了三小时思考，决定买下去北疆的机票，领略冬天的北疆。\n\t\n原定打算和两位朋友一起前往，出发当天天山机场大雾导致大面积航班延误取消，机长广播通知我搭乘的航班将备降吐鲁番。落地以后也迟迟不能起飞，工作人员安排了空铁联运到达乌鲁木齐。一次很新奇的体验，朋友那边航班飞至青海上空开始返回成都天府，航班取消了。\n\t\n那我接下来的行程就是一个人啦！因为事先也没有做任何的攻略，又考虑到冬天自驾存在一定危险性。综合考量下来加入一个6天的小团，大致计算了一下费用倒也还好在接受范围内。\n\n终于到达乌鲁木齐，走出火车站确实还是感到很是寒冷，能见度尤其低，我的行李不多，一个小箱子和一个小包，是我多次压缩后的成果！一边拖着箱子在满地冰沙的路上行走，一边和向导电话沟通，没有戴手套，一会就冻得通红。打了车到了酒店，和朋友聊了一会天后准备接下来的行程。晚上去到大巴扎想着买一些特产，冬季算是淡季，许多商铺没什么人，我去的时候也比较晚了，最后就买了三双驼毛袜子和很多零食回来，作为路上的口粮。&#34;},{&#34;title&#34;:&#34;20岁西藏之旅&#34;,&#34;url&#34;:&#34;/en/blog/travel-xizang&#34;,&#34;description&#34;:&#34;2026.07.27 - 08.09&#34;,&#34;body&#34;:&#34;## 随记\n\n### 摘要\n  7月10日，一个电话打来：“问你去不去西藏？”  \n  “？我要！什么时候？”  \n  “月底吧，等你放假。”  \n  7月27日，20岁，我出发了。和往常一样，是和我的发小一块出行。“青春没有售价，硬座直达拉萨”，硬座太难受，所以我们选了硬卧，从遂宁出发到重庆乘坐Z223次列车进藏，开始为期14天的西藏之旅。   \n### 正文\n#### **Day0 7月26日**  \n  收拾东西是极其繁琐纠结的一件事。什么不得不带，什么东西一定要带，什么东西想带但是不好带...... 这次我带了尽可能最全的物品，这也让我的包格外的重。明天就要出发了，难免有些睡不着！\n#### **Day1 7月27日**\n  中午十一点，吃完早午饭，我就出发了，和大家到楼下汇合。从家里到重庆的路途是带一点艰辛的，我们四个人先坐天府行到遂宁，从遂宁到重庆，再坐火车......    \n![图片说明](/content-assets/travel/images/editor/35bb9171-cc0e-4c15-a43b-b5fc0fe0b325.webp)\n  七月底的天气十分十分的热，从重庆下车后，每个人都是大汗淋漓，我们的车次是晚上发车的，这时距离火车发车还有10个小时，在出发前一定要洗漱干净。讨论了一下，四个人在重庆西就开了一个钟点房。  \n  就在楼下吃了两顿小炒，下午吃了干锅鸡和回锅肉，晚上吃的干锅鸡和回锅肉，吃的比较饱。  \n  进入车站，人好多，介于上次在新疆的旅游经验，本次我选择了使用背包出行，背着一个大包就出门了。同车厢的应该是一个刚毕业的高中生，由于我们都比较社恐，所以没有聊天。硬座的体验不如我想象中那般美好，大家都是大包小包的，放下行李后轻松一点。上铺的我只能躺着，躺着也发现了新的乐趣——iPad可以直接吸附在车顶，那么我可以平躺着看电视，belike：\n![图片说明](/content-assets/travel/images/editor/e9910bc2-a814-4b52-83dc-294ca4f02fe9.webp)\n  上铺睡着很神奇，其实躺着没一会就睡着了。  \n#### **Day2 7月28日**\n  凌晨，被热醒了。从上铺飞下来，发现小李还没睡，玩手机呢在。我问他热不热，他说热死了。  \n  “要不我们去其他车厢看看？”  \n  “好。”  \n  车厢回荡着哐哐的火车声和隐隐约约的交谈声，混杂着空调轰轰的声音，有时候突然传来冲厕所的声音，巨大。车厢摇摇晃晃的，窗外时不时透射进来一点月光，余下的都是黑漆漆。每节车厢的温度有一点细微差别，但是有一节车厢特别凉快，我就问小李：“能不能让他把温度调低一档呀。”两个人都不敢问乘务员，就在别人门口，突然门自己开了，问我们半夜不睡觉在干嘛，乘务员当然拒绝了，他说每节车厢的空调都是技术人员设置好的，显示温度也是正常的。没办法我们就回自己床位了，神奇的是真的比刚刚更凉快了些许。那我们就睡了。  \n  第二天早上起来，窗外就是黄土高原样子，我觉得新奇，就拿出相机拍拍，大地是黄色的，交杂着一些树、土房子、电线杆、拖拉机，山脉层层叠叠，快到兰州了吧。\n![图片说明](/content-assets/travel/images/editor/98cf3c71-3de3-4f5e-9a4e-e8786e7580bb.webp)\n  走廊的大叔和他孩子在交谈，现在我记不起是在聊什么内容了，大致是在聊一些有关填报志愿和未来规划的事情，这个时间点应该刚完成志愿填报吧。今天中午我们就要抵达西宁，在西宁换供氧列车后继续出发。  \n  换好列车后，我们的车厢是火车的最后一节，特别幸运的是，我们是最后一节车厢的最后一个包厢，在火车的末端是一个洗漱间和一个窗户，可以看到火车走过的地方。刚上车时，这里特别安静，暖黄的光照射进来，这列车显然比昨天乘坐的列车干净整洁一些。\n![图片说明](/content-assets/travel/images/editor/f630f843-01f9-4f1e-b644-180d65584bfb.webp)\n  午饭时间，四个人决定去餐车觅食，好远啊，我们需要穿过九个车厢，人也密集，缓缓的走，还好最后餐车是有座位的。我们点了一个两人餐，泡面和一个自热火锅，小帅说他不吃饭，所以他后面高反了。\n![图片说明](/content-assets/travel/images/editor/d1cc5c2b-9129-4fb7-ad86-31d4ca0a5f09.webp)    从西宁站驶出不久就会经过青海湖了，可以说是本次列车经过的最好看的一段（因为Z223的行程规划，在翻越唐古拉山的时间段在夜晚，所以这一段风景是看不到了）。我们吃完饭没有停留就往回走，一节又一节车厢，每节车厢的人们精神状态都不一样，躺着的、歪着的，笑着的、难受的，回到我们温馨的包厢，舒服。等待着，等待着，远方的山脉突然降低，出现一汪蓝色的水。显然是青海湖了。我们的列车员就来自青海，特别热心，推着小推车售卖水果，他一边推销着，一边介绍自己的家乡。“你们一会啊，看到离青海湖最近的那一个小房子，那个就是我家，我家的羊最多。” 他一边说一边开心自满的笑着。 \n![他说中间那个白房子就是他的家](/content-assets/travel/images/editor/adaf179e-8bd2-4dbd-95c2-9a0ed317ca3b.webp)\n  青海湖好大，时不时有一群牛羊在缓慢的移动，在这里吃草应该比较幸福。铁路环绕它的一侧，我们可以欣赏它足足一小时之久。\n![图片说明](/content-assets/travel/images/editor/62bf95fc-31ff-4d25-9dd6-fd7cc2636ef8.webp)  \n![图片说明](/content-assets/travel/images/editor/358026fd-48c5-4c90-9887-e170ae490412.webp) \n  离开西宁站不久就会抵达德令哈站，我在这里下去走了走，然后又上车了。等到格尔木站的时候，这里的停留时间比较长，因为要在这里更换机车头。我们四个准备去吃个晚饭。格尔木的气温明显降低了一些，下车之后很多人在抽烟，我们拍了个照，然后快速的跑到餐车的位置。\n![图片说明](/content-assets/travel/images/editor/e292f251-8986-4833-b52b-3533e5c633f0.webp)  吃饭的时候，列车驶入了一片像荒漠的地方，这时候外面开始下雨，窗外面看是光秃秃的沙土山，雨越下越大，那远处就变得朦胧了。忽然能出现卡车，原来那里也是有公路的，和我们并排着走。\n![图片说明](/content-assets/travel/images/editor/255bba5e-5e0a-4da4-8ffc-7341b9b5e28f.webp)\n  天黑得快，一会就是蓝调时间，走廊的叔叔说着他当年进藏的经历，充满艰辛。蓝调时候，外面出现雪山，这时候的雾特别大，若隐若现的慢慢滑动。窗外还在下雨，雨水汇集成河流，从沟壑里流过。\n![图片说明](/content-assets/travel/images/editor/6fef660b-2bfc-4914-90f5-26b4f9d73c59.webp)\n  天黑透了，也没什么可以做的事情，列车员宣讲着预防高反的注意事项，我躺在床上，开始修图。其实是打算今天发一个朋友圈的，但是没网哈哈哈哈哈。\n#### **Day3 7月29日**\n  依旧凌晨，翻来覆去睡不着。上铺的冷气实在过于冷，又可能会叠加了一些高反，但总觉得是心理作用，总归就是睡不着。小帅也没睡着，小李也醒着，小飞倒是一直睡。小梁高反。就这样折磨了一晚上，终于在第二天快抵达目的地。  \n  终于快到拉萨！but，我们的火车成功晚点了一小时！怎么办呢，我们原计划在拉萨站转乘动车前往林芝与大部队的大家汇合呢。青藏铁路在快靠近拉萨的这一段很好看，郁郁葱葱的，因为在下雨，窗外绿油油的显得尤为清新。应该是青稞田和一户户农家，穿插其中的是青藏公路。得知火车晚点，那没办法了，只好想一下planB。那么面前有两种方案：要么坐下一班车前往林芝，但这会改变我们的行程，因为下一班直接排到了傍晚时候，到林芝已经是十一点了；要么包车前往林芝。我们自己决定先购买好了下一班车票以防万一。挺崩溃吧，坐了34h火车然后还要坐火车。  \n  火车到站了，我们联系上了大部队，他们为我们预定了包车，不用再坐火车了。今天拉萨是阴天，从火车上下来凉飕飕的，暂时没觉得有高反，只是肚子饿饿的。那么我们来到了拉萨，青春直达拉萨。  \n  又是20分钟的等待......我们的包车来了，司机给我打电话，诶，是熟悉的四川话。司机是在这边的四川人，其实在西藏的四川老乡很多，这也就是为什么我们14天的旅途中随时都能食川味小炒。上车，关门，再出发。我们前往林芝。在车上往左边望去就是拉萨城区，我急切的寻找布达拉宫，好像在寻找我来到拉萨的证据，赶紧拿出手机抓下一张图片。\n![图片说明](/content-assets/travel/images/editor/bc822989-3c83-4363-806c-73ee8783baa7.webp)\n  从拉萨到林芝的路上，两边的景色变化巨大。第一次知道林芝这个地方是因为这是我舅舅当年服役的地方，他说林芝是他的第二故乡，景色秀美，魂牵梦萦。拉萨和林芝通了高速公路，两侧的山上树木愈来愈多，愈来愈密，和拉林高速并列着就是国道。我尤其喜欢在一片田地里一颗颗叫不出名字的树。他们三个早睡着了，然后我也睡着了。\n![图片说明](/content-assets/travel/images/editor/c2bd51b3-43f8-4987-b46c-a3fddd026ed6.webp)\n  睁开眼已经在林芝城里，马上就和他们汇合。当务之急是吃饭。他们在路边一个川菜馆等我们，点了一桌子菜，有豆花汤、回锅肉、水煮肉片、炒菜，其他的记不清了，我们四个只能是狼吞虎咽的吃饱了。接下来正式开始西藏行的自驾游部分......  \n  播放着Jay的音乐我们就出发。第一站是林芝鲁朗小镇，藏语意为“龙王谷，神仙居住的地方”，从林芝出发约两小时就到了，我们去的时候天气不很好，多云天气，但是一下车就看到一道彩虹斜在山头，远处的高山名为支巴岗日，大部分都隐藏在厚云里面。\n![图片说明](/content-assets/travel/images/editor/bea6fa36-1254-4fed-a914-0e59765a3a9b.webp)\n  抵达小镇，大家都比较疲惫，在各自房间歇息。我们房间的窗外就能看到彩虹，洗漱完毕后我就躺在床上望着它，一点一点的移动。大家约定好了吃完晚饭出去逛逛。林芝有一个比较特色的菜叫做“石锅鸡”，往来路上许多卖石锅的小铺。将新鲜的鸡肉和许多的菌子混在一起下锅，沸腾的汤咕噜咕噜的冒泡，民宿的餐厅只我们一行人，香味在房间扩散。其实这个时候想到去年在甘孜吃的牛肉火锅，大家坐成一桌，开饭。\n![图片说明](/content-assets/travel/images/editor/5b02e83d-6ba5-4279-a55d-725402c674e3.webp)\n  民宿老板是当地人，进门大堂上都是小朋友的奖状。听说我们想要吃饭，所以还单独蒸了一锅米饭。大概也是饿了的原因，这一顿尤其美味，鸡肉弹牙，菌子也鲜嫩，我向来喜爱炖鸡，这一顿也是投其所好了。饭毕，大家整理衣裳准备出门。晚上还是稍稍有些冷，我们先是往一个小山包走去，老板说那里拍照好看。路上遇到一只小猫，毛茸茸的，跑的飞快。拍完这张照后，它就一下躲到草丛里面去了。\n![图片说明](/content-assets/travel/images/editor/a2dc9cd3-a455-4327-a024-92f011447335.webp)\n  这上面有一颗树我很喜欢，树根粗壮有力，树冠广阔（我也不知道怎么形容），就那样斜立在山坡上，和小路另一旁的树林形成一个通道，仿佛走进可以到达另外一个地方。到处都是花，各种各样的野花，漫山遍野的开满了山坡。天暗了，往远处的村庄已经亮灯，到处都安静，只有隔壁马儿铃铛摇晃着声音。  \n  拍完照下来天黑透了。村庄里响起音乐，越走越近，小镇广场中央点燃了篝火。播放着这首[昌都央切](https://c6.y.qq.com/base/fcgi-bin/u?__=VZ5Ac8sFqoTv)欢快歌曲，三五个藏族姐姐开始围着火堆跳起锅庄舞，活泼的小孩也加入了他们，游客也模仿着加入队伍，一下就十分热闹了。\n![图片说明](/content-assets/travel/images/editor/9cbb03b3-6afd-48a3-af21-766ae32d82ba.webp)\n  熙熙攘攘的人群散去，买了本地芭蕉回酒店休息。明天我们就要离开这里了......good night~  \n#### **Day4 7月30日**\n  本着不赶时间的原则，大家起床已经九十点，大家状态都可以。今天的行程计划先前往牧场打卡游玩，然后驱车回到林芝市区。\n\n### **未完待续......**  \n## 阅览原文\n> [目的地-西藏](/zz/destinations/xizang/)  \n> [Roy的相册](/zz/)&#34;}]" data-en="true"> <label class="sr-only" for="search-query">Search</label> <input id="search-query" type="search" placeholder="Search articles, pages and photos…" class="my-5 w-full rounded-xl bor
